<html lang="en">

<title>PLAYCO — HR Recruitment Dashboard</title>
<style>
  :root{
    --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
    --ink:#0f172a; --ink-soft:#475569; --ink-faint:#94a3b8;
    --line:#e2e8f0; --bg:#f1f5f9; --card:#ffffff;
    --green:#059669; --green-bg:#ecfdf5;
    --amber:#d97706; --amber-bg:#fffbeb;
    --red:#dc2626;  --red-bg:#fef2f2;
    --blue:#2563eb; --blue-bg:#eff6ff;
    --radius:10px;
    --shadow:0 1px 3px rgba(15,23,42,.08), 0 1px 2px rgba(15,23,42,.04);
    --shadow-lg:0 10px 24px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI", -apple-system, Arial, sans-serif; color:var(--ink); background:var(--bg); font-size:14px;}
  button{font:inherit; cursor:pointer;}
  ::selection{background:#c7d2fe;}

  /* ===== Layout ===== */
  #sidebar{
    position:fixed; top:0; left:0; bottom:0; width:232px;
    background:#111827; color:#d1d5db;
    padding:20px 0; overflow-y:auto; z-index:10;
  }
  #main{margin-left:232px; padding:32px 40px; max-width:1240px;}

  .logo{display:flex; align-items:center; gap:10px; padding:0 20px 20px;}
  .logo-mark{width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,#6366f1,#a855f7);
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px;}
  .logo b{color:#fff; font-size:16px; letter-spacing:1.5px; display:block;}
  .logo small{font-size:10.5px; color:#9ca3af;}

  .nav-group{margin:14px 0;}
  .nav-label{font-size:10px; letter-spacing:1.6px; color:#6b7280; padding:0 20px 8px; text-transform:uppercase;}
  .nav-item{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; color:#d1d5db;
    padding:9px 20px; border-left:3px solid transparent; font-size:13.5px;
  }
  .nav-item .ico{width:18px; text-align:center; font-size:14px;}
  .nav-item:hover{background:#1f2937; color:#fff;}
  .nav-item.active{border-left-color:var(--primary); background:#1f2937; color:#fff; font-weight:600;}
  .nav-sep{border:none; border-top:1px solid #1f2937; margin:14px 20px;}

  /* ===== Typography & blocks ===== */
  h1{font-size:23px; font-weight:700; letter-spacing:-.3px;}
  h2{font-size:12px; letter-spacing:1.4px; color:var(--ink-faint); text-transform:uppercase; font-weight:700; margin:30px 0 14px;}
  .sub{color:var(--ink-soft); margin-top:4px; margin-bottom:22px;}
  .pagehead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:16px;}
  .muted{color:var(--ink-faint);}
  .mt8{margin-top:8px;} .mt16{margin-top:16px;} .mb8{margin-bottom:8px;} .mb16{margin-bottom:16px;}
  .row{display:flex; gap:10px; align-items:center;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
  .grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}

  /* ===== Stat cards ===== */
  .stat{text-align:left; position:relative; overflow:hidden; transition:transform .12s, box-shadow .12s;}
  .stat:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg);}
  .stat .num{font-size:30px; font-weight:800; letter-spacing:-1px;}
  .stat .lbl{color:var(--ink-soft); margin-top:2px; font-size:13px;}
  .stat .icon{position:absolute; right:14px; top:14px; width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:17px;}
  .ic-indigo{background:var(--primary-soft);} .ic-blue{background:var(--blue-bg);}
  .ic-amber{background:var(--amber-bg);} .ic-green{background:var(--green-bg);}

  .clickable{cursor:pointer;}

  /* ===== Badges ===== */
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 10px;
    border-radius:999px; white-space:nowrap; letter-spacing:.2px;
    background:#f1f5f9; color:var(--ink-soft);
  }
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .badge.open,.badge.accepted,.badge.hired,.badge.upcoming,.badge.completed{background:var(--green-bg); color:var(--green);}
  .badge.screening,.badge.pendingapproval,.badge.feedbacksent,.badge.needsscheduling,.badge.sent,.badge.approved{background:var(--amber-bg); color:var(--amber);}
  .badge.interview,.badge.scheduled{background:var(--blue-bg); color:var(--blue);}
  .badge.rejected,.badge.declined,.badge.closed,.badge.draft{background:var(--red-bg); color:var(--red);}
  .badge.offer{background:var(--primary-soft); color:var(--primary);}
  .badge.draft{background:#f1f5f9; color:var(--ink-faint);}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line);
    padding:8px 15px; border-radius:8px; color:var(--ink-soft); font-weight:600; font-size:13px;
    transition:all .12s; box-shadow:var(--shadow);
  }
  .btn:hover{border-color:#cbd5e1; color:var(--ink);}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.danger{color:var(--red); border-color:#fecaca; background:var(--red-bg);}
  .btn.danger:hover{background:#fee2e2;}
  .btn.sm{padding:5px 11px; font-size:12px;}
  .linkbtn{background:none; border:none; color:var(--primary); font-weight:600; padding:0; font-size:12.5px;}
  .linkbtn:hover{text-decoration:underline;}

  /* ===== Forms ===== */
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:18px;}
  .toolbar input[type=text], .toolbar select{
    border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:#fff; font:inherit; color:var(--ink);
  }
  .toolbar input[type=text]{flex:1; max-width:340px;}
  .toolbar input:focus, .toolbar select:focus, .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid #c7d2fe; border-color:var(--primary);
  }
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; background:#fff; color:var(--ink);
  }
  .field textarea{min-height:76px; resize:vertical;}

  /* ===== Tabs ===== */
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:20px 0 22px;}
  .tab{background:none; border:none; border-bottom:2px solid transparent; padding:9px 15px; color:var(--ink-soft); font-weight:600; font-size:13.5px; margin-bottom:-1px;}
  .tab:hover{color:var(--ink);}
  .tab.active{border-bottom-color:var(--primary); color:var(--primary);}
  .tab .cnt{background:#e2e8f0; color:var(--ink-soft); border-radius:999px; padding:1px 7px; font-size:11px; margin-left:5px;}
  .tab.active .cnt{background:var(--primary-soft); color:var(--primary);}

  .breadcrumb{font-size:12.5px; color:var(--ink-faint); margin-bottom:12px;}
  .breadcrumb button{background:none; border:none; color:var(--ink-faint); padding:0; font-size:12.5px;}
  .breadcrumb button:hover{color:var(--primary);}

  /* ===== Pipeline ===== */
  .pipeline{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start;}
  .stage{background:#e9edf3; border-radius:12px; padding:12px; min-height:140px;}
  .stage h3{font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-soft); font-weight:700;
    margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
  .stage h3 .cnt{background:#fff; border-radius:999px; padding:1px 8px; font-size:11px; color:var(--ink-soft);}
  .cand-card{background:#fff; border-radius:10px; padding:12px; margin-bottom:10px; box-shadow:var(--shadow); transition:box-shadow .12s, transform .12s;}
  .cand-card:hover{box-shadow:var(--shadow-lg); transform:translateY(-1px);}
  .cand-card .nm{font-weight:700; font-size:13.5px;}
  .cand-card .avatar{width:30px; height:30px; border-radius:50%; background:var(--primary-soft); color:var(--primary);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11.5px; flex-shrink:0;}
  .cand-card .meta{font-size:11.5px; color:var(--ink-faint); margin:8px 0 10px; line-height:1.6;}
  .move{display:flex; gap:6px;}
  .move button{flex:1; font-size:11.5px; padding:5px 0; background:#f8fafc; border:1px solid var(--line); border-radius:6px; color:var(--ink-soft); font-weight:600;}
  .move button:hover:not(:disabled){border-color:var(--primary); color:var(--primary); background:var(--primary-soft);}
  .move button:disabled{opacity:.35; cursor:default;}

  /* ===== Action items ===== */
  .action-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;
    box-shadow:var(--shadow); transition:all .12s; font-size:13.5px;}
  .action-item:hover{border-color:#c7d2fe; box-shadow:var(--shadow-lg); transform:translateX(2px);}
  .action-item .warn{width:34px; height:34px; border-radius:9px; background:var(--amber-bg); color:var(--amber);
    display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .action-item .arrow{margin-left:auto; color:var(--ink-faint); font-size:16px;}

  /* ===== Today ===== */
  .today-row{display:flex; gap:16px; align-items:center; width:100%; text-align:left;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:13px 16px; margin-bottom:8px;
    box-shadow:var(--shadow); transition:all .12s;}
  .today-row:hover{border-color:#c7d2fe; box-shadow:var(--shadow-lg);}
  .today-row .time{font-weight:800; width:52px; flex-shrink:0; color:var(--primary); font-size:13.5px;}
  .today-row .what b{display:block; font-size:13.5px;}
  .today-row .what span{color:var(--ink-faint); font-size:12px;}

  /* ===== Entries ===== */
  .entry{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px;
    box-shadow:var(--shadow); transition:all .12s;}
  .entry.clickable:hover{border-color:#c7d2fe; box-shadow:var(--shadow-lg);}
  .entry .top{display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .entry .nm{font-weight:700; font-size:15px;}
  .entry .meta{color:var(--ink-faint); font-size:12.5px; margin-top:3px; line-height:1.55;}
  .entry .apps{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:8px 18px;}

  /* ===== Detail blocks ===== */
  .detail-block{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; box-shadow:var(--shadow);}
  .detail-block h3{font-size:11px; letter-spacing:1.3px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px; font-weight:700;}
  .kv{display:grid; grid-template-columns:170px 1fr; row-gap:9px; font-size:13.5px;}
  .kv dt{color:var(--ink-faint);}

  /* ===== Checklist / progress ===== */
  .check{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .check:last-child{border-bottom:none;}
  .check .box{width:19px; height:19px; border:2px solid #cbd5e1; border-radius:6px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; flex-shrink:0; transition:all .12s;}
  .check.done .box{background:var(--green); border-color:var(--green);}
  .check.done .txt{color:var(--ink-faint); text-decoration:line-through;}
  .progress{height:9px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin-top:14px;}
  .progress > div{height:100%; background:linear-gradient(90deg,#6366f1,#a855f7); border-radius:999px; transition:width .25s;}

  /* ===== Calendar ===== */
  .cal-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px;}
  .cal-head{font-size:10.5px; letter-spacing:1.2px; color:var(--ink-faint); text-align:center; padding:8px 0; text-transform:uppercase; font-weight:700;}
  .cal-cell{background:#fff; border:1px solid var(--line); border-radius:10px; min-height:104px; padding:8px; box-shadow:var(--shadow);}
  .cal-cell .day{font-size:12px; color:var(--ink-faint); margin-bottom:7px; font-weight:600;}
  .cal-cell.today{border:2px solid var(--primary);}
  .cal-cell.today .day{color:var(--primary); font-weight:800;}
  .cal-ev{border:1px solid #ddd6fe; background:var(--primary-soft); border-radius:7px; padding:5px 8px; font-size:11.5px;
    margin-bottom:5px; text-align:left; width:100%; color:var(--ink); transition:all .12s;}
  .cal-ev:hover{border-color:var(--primary); box-shadow:var(--shadow);}
  .cal-ev b{display:block; font-size:11px; color:var(--primary);}

  /* ===== Feedback ===== */
  .rating{display:flex; gap:8px; margin:8px 0 14px;}
  .rating button{width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:#fff; font-size:13px; color:var(--ink-faint); transition:all .12s;}
  .rating button.on{background:var(--primary); border-color:var(--primary); color:#fff;}
  .radio-row{display:flex; gap:18px; flex-wrap:wrap; margin:8px 0 14px;}
  .radio-row label{display:flex; gap:7px; align-items:center; font-size:13.5px; cursor:pointer; color:var(--ink-soft);}
  .radio-row input{accent-color:var(--primary);}

  .filter-note{background:var(--primary-soft); border:1px solid #ddd6fe; border-radius:var(--radius); padding:10px 14px;
    font-size:13px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; color:var(--primary-dark);}

  .toast{position:fixed; bottom:26px; right:26px; background:#111827; color:#fff; padding:12px 20px;
    border-radius:10px; font-size:13.5px; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; box-shadow:var(--shadow-lg); z-index:99;}
  .toast.show{opacity:1; transform:translateY(0);}
</style>
</head>

/* ================= ROUTER ================= */
function navigate(hash){ location.hash = hash; }
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "") || "dashboard";
  const [path, qs] = h.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs||""));
  const seg = path.split("/").filter(Boolean);
  return {seg, params};
}
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function render(){
  const {seg, params} = parseHash();
  const page = seg[0] || "dashboard";
  document.querySelectorAll(".nav-item[data-route]").forEach(b=>{
    let r = b.dataset.route;
    let active = r===page || (r==="jobs" && page==="job") || (r==="candidates" && page==="candidate")
      || (r==="interviews" && page==="interview") || (r==="offers" && page==="offer");
    b.classList.toggle("active", active);
  });
  const views = {
    "dashboard": viewDashboard, "jobs": viewJobs, "job": viewJobDetail,
    "create-job": viewCreateJob, "candidates": viewCandidates, "candidate": viewCandidateProfile,
    "interviews": viewInterviews, "interview": viewInterviewDetail,
    "offers": viewOffers, "offer": viewOfferDetail,
    "onboarding": viewOnboarding, "calendar": viewCalendar,
  };
  const fn = views[page] || viewDashboard;
  $("#main").innerHTML = fn(seg.slice(1), params);
  window.scrollTo(0,0);
}

function setJobStatus(id, st){ job(id).status = st; toast(`Job status → ${st}`); render(); }
function moveStage(appId, dir){
  const a = app(appId);
  const idx = STAGES.indexOf(a.stage);
  const next = STAGES[idx+dir];
  if(!next) return;
  a.stage = next;
  toast(`${cand(a.cand).name} moved to ${next}`);
  if(next==="Offer"){
    const dup = offers.find(o=>o.app===a.id);
    if(!dup){
      offers.unshift({id:"o"+(nextOfferId++), app:a.id, salary:"Rp —", startDate:"—", status:"pending-approval", benefits:"—"});
      toast("Offer created — pending approval");
    }
  }
  render();
}
function createInterviewForJob(jobId){
  const a = applications.find(x=>x.job===jobId && x.stage==="Interview") || applications.find(x=>x.job===jobId);
  if(!a){ toast("No candidates in pipeline yet"); return; }
  interviews.push({id:"i"+(nextInterviewId++), app:a.id, round:"HR Interview", time:"—", date:"—", interviewer:"Sarah — HR", status:"needs-scheduling"});
  toast("Interview added to Needs Scheduling");
  navigate("#/interviews?tab=needs-scheduling");
}

    ${IV_TABS.map(t=>`<button class="tab ${t.key===tab?'active':''}" onclick="navigate('#/interviews?tab=${t.key}')">${t.label}<span class="cnt">${interviews.filter(i=>i.status===t.key).length}</span></button>`).join("")}
  </div>
  ${list.map(i=>{
    const a = app(i.app); if(!a) return "";
    const c = cand(a.cand), j = job(a.job);
    return `<div class="entry clickable" onclick="navigate('#/interview/${i.id}')">
      <div class="top">
        <div class="row" style="align-items:flex-start">
          <div style="width:42px;height:42px;border-radius:50%;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">${initials(c.name)}</div>
          <div>
            ${i.time!=="—"?`<div class="meta" style="font-weight:700;color:var(--primary)">${i.time.split(" – ")[0]} · ${esc(i.date)}</div>`:""}
            <div class="nm">${esc(j.title)}</div>
            <div class="meta">${esc(c.name)} · ${esc(i.round)} · Interviewer: ${esc(i.interviewer)}</div>
          </div>
        </div>
        <div class="row">
          ${badge(i.status.replace(/-/g," "))}
          ${i.status==="feedback-pending"?`<button class="btn sm primary" onclick="event.stopPropagation(); navigate('#/interview/${i.id}?focus=feedback')">Give Feedback</button>`:""}
          ${i.status==="needs-scheduling"?`<button class="btn sm" onclick="event.stopPropagation(); navigate('#/interview/${i.id}?focus=schedule')">Schedule</button>`:""}
        </div>
      </div>
    </div>`;
  }).join("") || `<p class="muted">Nothing here.</p>`}
  `;
}

/* ================= INTERVIEW DETAIL ================= */
function viewInterviewDetail(seg, params){
  const i = interview(seg[0]); if(!i) return "<p>Interview not found.</p>";
  const a = app(i.app); const c = cand(a.cand); const j = job(a.job);
  const others = interviews.filter(x=>x.app===i.app && x.id!==i.id);
  return `
  <div class="breadcrumb"><button onclick="navigate('#/interviews')">Interviews</button> / ${esc(i.round)}</div>
  <h1>Interview Detail</h1>
  <p class="sub">${esc(j.title)} · ${esc(c.name)}</p>

  ${params.focus==="schedule" && i.status==="needs-scheduling" ? `
    <div class="detail-block" style="border-color:#c7d2fe">
      <h3>Schedule Interview</h3>
      <div class="grid2">
        <div class="field"><label>Date</label><input type="text" id="sch-date" placeholder="e.g. October 2, 2026"></div>
        <div class="field"><label>Time</label><input type="text" id="sch-time" placeholder="e.g. 10:00 – 11:00"></div>
      </div>
      <button class="btn primary" onclick="scheduleInterview('${i.id}')">Confirm Schedule</button>
    </div>`:""}

  <div class="grid2">
    <div class="detail-block"><h3>When</h3>
      <p style="line-height:1.7">${i.time==="—" ? '<span class="muted">Not scheduled yet</span>' : "<b>"+esc(i.time)+"</b><br>"+esc(i.date)}</p>
      <p class="mt8">${esc(i.round)}</p>
    </div>
    <div class="detail-block"><h3>Status</h3><p>${badge(i.status.replace(/-/g," "))}</p>
      <p class="muted mt8" style="font-size:13px">Interviewer: ${esc(i.interviewer)}</p>
    </div>
  </div>

  <div class="detail-block"><h3>Actions</h3>
    <div class="row">
      ${i.status==="upcoming"?`<button class="btn primary" onclick="toast('Meeting link placeholder')">Join Meeting</button>`:""}
      <button class="btn" onclick="navigate('#/candidates/${c.id}')">View Candidate</button>
      <button class="btn" onclick="navigate('#/jobs/${j.id}?tab=pipeline')">View Application (Pipeline)</button>
    </div>
  </div>

  ${others.length?`
  <div class="detail-block"><h3>Other interviews for this application</h3>
    ${others.map(o=>`<div class="check"><span class="box ${o.status==='completed'?'done':''}" style="${o.status==='completed'?'background:var(--green);border-color:var(--green)':''}">${o.status==='completed'?'✓':''}</span>
      <span class="txt">${esc(o.round)} — ${badge(o.status.replace(/-/g," "))}</span>
      <button class="linkbtn" style="margin-left:auto" onclick="navigate('#/interview/${o.id}')">Open</button></div>`).join("")}
  </div>`:""}

  ${i.status==="feedback-pending" || i.status==="completed" ? `
    <div class="detail-block" id="feedback" style="${params.focus==='feedback'?'border:2px solid var(--primary)':''}">
      <h3>Interview Feedback ${i.status==="completed"?"(submitted)":""}</h3>
      ${i.status==="completed" && i.feedback ? `
        <dl class="kv">
          <dt>Rating</dt><dd style="color:var(--primary); letter-spacing:3px">${"★".repeat(i.feedback.rating)}${"☆".repeat(5-i.feedback.rating)}</dd>
          <dt>Recommendation</dt><dd>${esc(i.feedback.rec)}</dd>
          <dt>Notes</dt><dd>${esc(i.feedback.notes)}</dd>
        </dl>` : `
        <label class="muted" style="font-size:12px; font-weight:600">Rating</label>
        <div class="rating" id="fb-rating">
          ${[1,2,3,4,5].map(n=>`<button onclick="setRating(${n})">${n}</button>`).join("")}
        </div>
        <label class="muted" style="font-size:12px; font-weight:600">Recommendation</label>
        <div class="radio-row">
          ${["Strong Yes","Yes","No","Strong No"].map((r,idx)=>`<label><input type="radio" name="fb-rec" value="${r}" ${idx===1?'checked':''}> ${r}</label>`).join("")}
        </div>
        <div class="field"><label>Notes</label><textarea id="fb-notes" placeholder="What went well? Any concerns?"></textarea></div>
        <div class="row">
          <button class="btn primary" onclick="submitFeedback('${i.id}')">Submit Feedback</button>
          <button class="btn danger" onclick="rejectApplication('${i.app}')">Reject Candidate</button>
        </div>`}
    </div>`:""}
  `;
}
let fbRating = 0;
function setRating(n){
  fbRating = n;
  document.querySelectorAll("#fb-rating button").forEach((b,idx)=>b.classList.toggle("on", idx<n));
}
function scheduleInterview(id){
  const i = interview(id);
  const d = $("#sch-date").value.trim() || "October 2, 2026";
  const t = $("#sch-time").value.trim() || "10:00 – 11:00";
  i.date = d; i.time = t; i.status = "upcoming";
  toast("Interview scheduled");
  render();
}
function submitFeedback(id){
  const i = interview(id);
  const rec = document.querySelector('input[name="fb-rec"]:checked')?.value || "Yes";
  i.feedback = {rating: fbRating||3, rec, notes: $("#fb-notes").value || "—"};
  i.status = "completed";
  fbRating = 0;
  toast("Feedback submitted");
  render();
}
function rejectApplication(appId){
  const a = app(appId);
  a.stage = "Rejected";
  interviews.filter(x=>x.app===appId && x.status!=="completed").forEach(x=>x.status="completed");
  toast(cand(a.cand).name + " rejected for " + job(a.job).title);
  navigate("#/jobs/"+a.job+"?tab=pipeline");
}

/* ================= OFFERS ================= */
const OFFER_TABS = [
  {key:"pending-approval", label:"Pending Approval"},
  {key:"sent", label:"Sent"},
  {key:"accepted", label:"Accepted"},
  {key:"declined", label:"Declined"},
];
function viewOffers(seg, params){
  const tab = params.tab || "pending-approval";
  const list = offers.filter(o=>o.status===tab);
  return `
  <h1>Offers</h1>
  <p class="sub">Approval → Send → Candidate decision → Onboarding.</p>
  <div class="tabs">
    ${OFFER_TABS.map(t=>`<button class="tab ${t.key===tab?'active':''}" onclick="navigate('#/offers?tab=${t.key}')">${t.label}<span class="cnt">${offers.filter(o=>o.status===t.key).length}</span></button>`).join("")}
  </div>
  ${list.map(o=>{
    const a = app(o.app); if(!a) return "";
    const c = cand(a.cand), j = job(a.job);
    return `<div class="entry clickable" onclick="navigate('#/offers/${o.id}')">
      <div class="top">
        <div class="row" style="align-items:flex-start">
          <div style="width:42px;height:42px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">${initials(c.name)}</div>
          <div><div class="nm">${esc(c.name)}</div><div class="meta">${esc(j.title)} · ${esc(o.salary)} · Start: ${esc(o.startDate)}</div></div>
        </div>
        <div class="row">
          ${badge(o.status.replace(/-/g," "))}
          <button class="btn sm" onclick="event.stopPropagation(); navigate('#/offers/${o.id}')">Review Offer</button>
        </div>
      </div>
    </div>`;
  }).join("") || `<p class="muted">No offers in this state.</p>`}
  `;
}

/* ================= OFFER DETAIL ================= */
function viewOfferDetail(seg){
  const o = offer(seg[0]); if(!o) return "<p>Offer not found.</p>";
  const a = app(o.app); const c = cand(a.cand); const j = job(a.job);
  const editable = o.status==="pending-approval";
  return `
  <div class="breadcrumb"><button onclick="navigate('#/offers')">Offers</button> / ${esc(c.name)}</div>
  <h1>Offer Detail</h1>
  <p class="sub">${badge(o.status.replace(/-/g," "))}</p>

  <div class="grid2">
    <div class="detail-block"><h3>Candidate & Position</h3>
      <dl class="kv">
        <dt>Candidate</dt><dd><button class="linkbtn" style="font-size:13.5px" onclick="navigate('#/candidates/${c.id}')">${esc(c.name)}</button></dd>
        <dt>Position</dt><dd>${esc(j.title)}</dd>
        <dt>Application</dt><dd><button class="linkbtn" style="font-size:13.5px" onclick="navigate('#/jobs/${j.id}?tab=pipeline')">View in Pipeline</button></dd>
      </dl>
    </div>
    <div class="detail-block"><h3>Compensation</h3>
      ${editable?`
        <div class="field"><label>Salary</label><input type="text" id="off-salary" value="${esc(o.salary)}"></div>
        <div class="field"><label>Start Date</label><input type="text" id="off-start" value="${esc(o.startDate)}"></div>
        <div class="field"><label>Benefits</label><textarea id="off-benefits">${esc(o.benefits)}</textarea></div>`
      :`<dl class="kv"><dt>Salary</dt><dd><b>${esc(o.salary)}</b></dd><dt>Start Date</dt><dd>${esc(o.startDate)}</dd><dt>Benefits</dt><dd style="white-space:pre-line; line-height:1.6">${esc(o.benefits)}</dd></dl>`}
    </div>
  </div>

  <div class="detail-block"><h3>Workflow</h3>
    <p class="muted" style="font-size:12.5px">Approved → Send Offer → Candidate Decision → Accepted / Declined → Onboarding</p>
    <div class="row mt8">
      ${o.status==="pending-approval"?`
        ${editable?`<button class="btn sm" onclick="saveOffer('${o.id}')">Save Changes</button>`:""}
        <button class="btn primary" onclick="approveOffer('${o.id}')">Approve</button>
        <button class="btn danger" onclick="rejectOffer('${o.id}')">Reject</button>`:""}
      ${o.status==="approved"?`<button class="btn primary" onclick="sendOffer('${o.id}')">Send Offer</button>`:""}
      ${o.status==="sent"?`
        <span class="muted">Waiting for candidate decision…</span>
        <button class="btn primary" onclick="decideOffer('${o.id}','accepted')">Mark Accepted</button>
        <button class="btn danger" onclick="decideOffer('${o.id}','declined')">Mark Declined</button>`:""}
      ${o.status==="accepted"?`<button class="btn primary" onclick="navigate('#/onboarding')">Go to Onboarding →</button>`:""}
      ${o.status==="declined"?`<span class="muted">Offer declined by candidate.</span>`:""}
    </div>
  </div>
  `;
}
function saveOffer(id){
  const o = offer(id);
  o.salary = $("#off-salary").value; o.startDate = $("#off-start").value; o.benefits = $("#off-benefits").value;
  toast("Offer updated"); render();
}
function approveOffer(id){ offer(id).status="approved"; toast("Offer approved — ready to send"); render(); }
function rejectOffer(id){
  const o = offer(id); o.status="declined";
  app(o.app).stage = "Rejected";
  toast("Offer rejected"); navigate("#/offers?tab=declined");
}
function sendOffer(id){ offer(id).status="sent"; toast("Offer sent to candidate"); render(); }
function decideOffer(id, decision){
  const o = offer(id); o.status = decision;
  const a = app(o.app);
  if(decision==="accepted"){
    a.stage = "Hired";
    onboardings.push({id:"n"+(nextOfferId++), offer:o.id,
      steps:{accepted:true, documents:false, background:false, equipment:false, email:false, access:false, orientation:false, ready:false}});
    toast("Offer accepted — onboarding created");
  } else {
    a.stage = "Rejected";
    toast("Offer declined");
  }
  render();
}

/* ================= ONBOARDING ================= */
const OB_STEPS = [
  {key:"accepted", label:"Offer Accepted"},
  {key:"documents", label:"Documents Submitted"},
  {key:"background", label:"Background Check"},
  {key:"equipment", label:"Equipment Prepared"},
  {key:"email", label:"Email Account Created"},
  {key:"access", label:"System Access"},
  {key:"orientation", label:"Orientation Scheduled"},
  {key:"ready", label:"Ready to Start"},
];
function viewOnboarding(){
  return `
  <h1>Onboarding</h1>
  <p class="sub">Candidates who accepted their offer — tracking the transition to employee.</p>
  ${onboardings.map(n=>{
    const o = offer(n.offer); const a = app(o.app); const c = cand(a.cand); const j = job(a.job);
    const done = OB_STEPS.filter(s=>n.steps[s.key]).length;
    const pct = Math.round(done/OB_STEPS.length*100);
    return `<div class="card mb16">
      <div class="row" style="justify-content:space-between; align-items:flex-start">
        <div class="row" style="align-items:flex-start; gap:14px">
          <div style="width:46px;height:46px;border-radius:50%;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700">${initials(c.name)}</div>
          <div>
            <div style="font-weight:700; font-size:15.5px">${esc(c.name)}</div>
            <div class="meta muted" style="font-size:12.5px; margin-top:2px">${esc(j.title)} · Start Date: ${esc(o.startDate)}</div>
          </div>
        </div>
        <div style="text-align:right">
          ${badge(pct===100 ? "Completed" : pct+"% Complete")}
          <div class="mt8"><button class="linkbtn" onclick="navigate('#/candidates/${c.id}')">View Candidate</button></div>
        </div>
      </div>
      <div class="grid2 mt16">
        ${OB_STEPS.map(s=>`
          <div class="check ${n.steps[s.key]?'done':''}" style="cursor:pointer" onclick="toggleOB('${n.id}','${s.key}')">
            <span class="box">${n.steps[s.key]?'✓':''}</span><span class="txt">${s.label}</span>
          </div>`).join("")}
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>
    </div>`;
  }).join("") || `<p class="muted">No one is onboarding yet. Accepted offers appear here automatically.</p>`}
  `;
}
function toggleOB(nid, key){
  const n = onboardings.find(x=>x.id===nid);
  n.steps[key] = !n.steps[key];
  render();
}

/* ================= CALENDAR ================= */
function viewCalendar(){
  // September 2026: Sep 1 = Tuesday. Week rows Mon–Fri.
  const days = [
    {d:1, evs:[]},{d:2, evs:[]},{d:3, evs:[]},{d:4, evs:[]},
    {d:7, evs:[]},{d:8, evs:[]},{d:9, evs:[]},{d:10, evs:[]},{d:11, evs:[]},
    {d:14, evs:[]},{d:15, evs:[]},{d:16, evs:[]},{d:17, evs:[]},{d:18, evs:[]},
    {d:21, evs:[]},{d:22, evs:[{t:"13:00", l:"Interview #2 — Hiring Manager", i:"i10"}]},
    {d:23, evs:[]},{d:24, evs:[]},{d:25, evs:[{t:"10:00", l:"HR Interview — Raphael N.", i:"i7"}]},
    {d:28, evs:[{t:"15:00", l:"Screening Call — Sarah Lee", i:"i8"}]},
    {d:29, evs:[
      {t:"09:00", l:"Product Analyst — Raphael N.", i:"i1"},
      {t:"11:00", l:"Software Engineer — Sarah Lee", i:"i2"},
      {t:"14:00", l:"Marketing Specialist — John Tan", i:"i3"},
      {t:"16:00", l:"Hiring Manager Review", i:"i4"},
    ]},
    {d:30, evs:[{t:"09:00", l:"HR Interview — John Tan", i:"i9"}]},
  ];
  const cell = (day, isBlank)=> isBlank
    ? `<div class="cal-cell" style="background:#e9edf3; border-style:dashed; box-shadow:none"></div>`
    : `<div class="cal-cell ${day.d===29?'today':''}">
        <div class="day">${day.d}${day.d===29?' · Today':''}</div>
        ${day.evs.map(e=>`<button class="cal-ev" onclick="navigate('#/interview/${e.i}')"><b>${e.t}</b>${esc(e.l)}</button>`).join("")}
       </div>`;
  return `
  <div class="pagehead">
    <div><h1>Calendar</h1><p class="sub" style="margin-bottom:0">Time-based view of recruitment activity — interviews, reviews and candidate meetings.</p></div>
    <div class="row"><button class="btn sm">‹</button><b style="font-size:15px">September 2026</b><button class="btn sm">›</button></div>
  </div>
  <div class="cal-grid mt16">
    ${["Mon","Tue","Wed","Thu","Fri"].map(d=>`<div class="cal-head">${d}</div>`).join("")}
    ${cell(null,true)}${days.slice(0,4).map(d=>cell(d)).join("")}
    ${days.slice(4,9).map(d=>cell(d)).join("")}
    ${days.slice(9,14).map(d=>cell(d)).join("")}
    ${days.slice(14,19).map(d=>cell(d)).join("")}
    ${days.slice(19,22).map(d=>cell(d)).join("")}${cell(null,true)}${cell(null,true)}
  </div>
  <div class="card mt16"><h3 style="font-size:11px; letter-spacing:1.3px; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px; font-weight:700">Unscheduled — needs attention</h3>
    ${interviews.filter(i=>i.status==="needs-scheduling").map(i=>{
      const a = app(i.app);
      return `<div class="check"><span class="box"></span><span class="txt">${esc(i.round)} — ${esc(cand(a.cand).name)} · ${esc(job(a.job).title)}</span>
        <button class="linkbtn" style="margin-left:auto" onclick="navigate('#/interview/${i.id}?focus=schedule')">Schedule →</button></div>`;
    }).join("") || `<p class="muted" style="font-size:12.5px">All interviews are scheduled.</p>`}
  </div>
  `;
}

/* sidebar click handlers */
document.querySelectorAll(".nav-item[data-route]").forEach(b=>{
  b.addEventListener("click", ()=>navigate("#/"+b.dataset.route));
});
</script>
